<!doctype html>
<html lang="en-US">
<head>
    <title>Odin Sign-Up Form</title>

    <!-- IMPORTED FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- LINKED FILES -->
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="container">
        <div id="welcome-image-container">
            <img id="welcome-image" src="images/background-image.png" alt="Aurora borealis">
        </div>
        <div id="welcome-form-container">
            <div class="gray-background" id="welcome-message">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
                <p>You <em>know</em> you want to.</p>
            </div>
            <div id="form-input">
                <p>
                    Let's do this!
                </p>
                <form action="#" method="post" id="my-form">
                    <div class="input-label-container">
                        <label for="first-name">FIRST NAME</label>
                        <input id="first-name" type="text" required>
                    </div>

                    <div class="input-label-container">
                        <label for="last-name">LAST NAME</label>
                        <input id="last-name" type="text" required>
                    </div>

                    <div class="input-label-container">
                        <label for="user-email">EMAIL</label>
                        <input id="user-email" type="email" required>
                    </div>

                    <div class="input-label-container">
                        <label for="user-phone-number">PHONE NUMBER</label>
                        <input id="user-phone-number" type="tel" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
                    </div>

                    <div class="input-label-container">
                        <label for="user-password">PASSWORD</label>
                        <input id="user-password" type="password" required>
                    </div>

                    <div class="input-label-container">
                        <label for="confirm-user-password">CONFIRM PASSWORD</label>
                        <input id="confirm-user-password" type="password" required>
                    </div>
                </form>

            </div>
            <div class="gray-background" id="form-buttons">
                <button type="submit" form="my-form">Create Account</button>
            </div>

        </div>
    </div>

</body>
</html>
